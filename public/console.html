<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebScrcpy</title>
    <link rel="manifest" href="/static/manifest.json">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet">
    <!-- Google Fonts: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/console.css">
    <script src="/static/i18n.js"></script>
    <script src="/static/console.js" defer></script>
</head>

<body class="min-h-screen flex flex-col pb-20 md:pb-0">

    <!-- Top App Bar -->
    <header
        class="sticky top-0 z-10 backdrop-blur-md bg-[#141414]/90 border-b border-[#28292a] px-4 py-4 md:px-8 md:py-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="material-symbols-rounded text-3xl text-[var(--md-sys-color-primary)]">devices</span>
                <h1 class="text-xl md:text-2xl font-semibold tracking-tight" data-i18n="app_title">WebScrcpy
                </h1>

                <div class="hidden md:flex items-center gap-2 ml-6 border-l border-gray-700 pl-6">
                    <button class="lang-btn text-xs font-medium text-gray-400 hover:text-white transition-colors"
                        data-lang="en" onclick="i18n.setLang('en')">EN</button>
                    <button class="lang-btn text-xs font-medium text-gray-400 hover:text-white transition-colors"
                        data-lang="zh" onclick="i18n.setLang('zh')">中文</button>
                    <button class="lang-btn text-xs font-medium text-gray-400 hover:text-white transition-colors"
                        data-lang="ja" onclick="i18n.setLang('ja')">JP</button>
                </div>
            </div>
            <button onclick="fetchDevices()" class="p-2 rounded-full hover:bg-white/10 transition-colors"
                data-i18n-title="refresh" title="Refresh">
                <span class="material-symbols-rounded text-[#e3e3e3]">refresh</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-8">

        <!-- Action Chips / Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h2 class="text-2xl font-medium mb-1" data-i18n="connected_devices">已连接设备</h2>
                <p class="text-sm text-[var(--md-sys-color-on-surface-variant)]" data-i18n="manage_devices_subtitle">
                    管理和串流您的设备</p>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                
                
                
            </div>
        </div>

        <!-- Device Grid -->
        <div id="deviceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Loading State -->
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-500">
                <div class="spinner mb-4"></div>
                <p data-i18n="scanning_devices">正在扫描设备...</p>
            </div>
        </div>

    </main>

    <!-- Configuration Modal -->
    <dialog id="configModal" class="bg-transparent p-4 m-auto outline-none">
        <div
            class="dialog-panel w-full max-w-md bg-[#1e1f20] rounded-[28px] p-6 shadow-2xl border border-[#333] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6 sticky top-0 bg-[#1e1f20] z-10 py-2">
                <div>
                    <h3 class="text-xl font-medium" id="configModalTitle" data-i18n="configure_device">配置设备</h3>
                    <p class="text-xs text-gray-400 mt-1" data-i18n="configure_subtitle">设置流传输参数</p>
                </div>
                <button onclick="closeModal('configModal')" class="p-1 rounded-full hover:bg-white/10">
                    <span class="material-symbols-rounded text-gray-400">close</span>
                </button>
            </div>

            <div class="space-y-6">
                <!-- Dynamic Settings Container -->
                <div id="dynamicSettings" class="space-y-6 flex flex-col min-h-[8rem] justify-center"></div>
                <div id="universalSettings" class="space-y-6 flex flex-col min-h-[4rem] justify-center"></div>

            </div>

            <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-[#333]">
                <button onclick="closeModal('configModal')"
                    class="px-5 py-2.5 rounded-full text-[var(--md-sys-color-primary)] hover:bg-white/5 font-medium text-sm transition-colors"
                    data-i18n="cancel">取消</button>
                <button onclick="saveDeviceConfig()"
                    class="px-6 py-2.5 rounded-full bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] font-medium text-sm shadow-sm hover:opacity-90 transition-opacity"
                    data-i18n="save_settings">保存设置</button>
            </div>
        </div>
    </dialog>

    <!-- Toast Container -->
    <div id="toast-container"></div>
</body>

</html>
